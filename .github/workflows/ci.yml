name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'enterprise/**'
  pull_request:
    branches:
      - main
      - 'enterprise/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Test Suite (Node.js 20)
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (Deterministic)
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-8.2.6
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Pre-download MongoDB binary for tests
        run: |
          cd backend
          node -e "import('mongodb-memory-server').then(m => m.MongoMemoryServer.create().then(s => s.stop()))"

      - name: Run Phase 1 & 1.1 Discovery Engine Tests
        run: |
          cd backend
          npm test

      - name: Run Phase 9.1 Durable Outbound WhatsApp Dispatch Idempotency Tests
        run: |
          cd backend
          npm run test:phase9.1

      - name: Run Phase 9 WhatsApp Automation Reliability Tests
        run: |
          cd backend
          npm run test:phase9

      - name: Run Phase 7 & 8 Concurrency & Intake Regression Tests
        run: |
          cd backend
          npm run test:regression

  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (Deterministic)
        run: |
          npm ci

      - name: Run Vite production build
        run: |
          npm run build
