name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'enterprise/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'enterprise/**'
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Test Suite (Node.js 20)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      NODE_ENV: test
      ALLOW_TRANSACTION_TEST_FALLBACK: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Redis Service Health
        run: |
          nc -z -w 2 127.0.0.1 6379
          echo "Redis service container is responding on 127.0.0.1:6379"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (Deterministic)
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-8.2.6
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Pre-download MongoDB binary for tests
        run: |
          cd backend
          node -e "import('mongodb-memory-server').then(m => m.MongoMemoryServer.create().then(s => s.stop()))"

      - name: Run Phase 1 & 1.1 Discovery Engine Tests
        run: |
          cd backend
          npm test

      - name: Run Phase 3 Lead Lifecycle, Scoring & Qualification Remediation Tests
        run: |
          cd backend
          npm run test:phase3

      - name: Run Phase 4 & 4.6 Multi-Tenancy & Contact Deduplication Tests
        run: |
          cd backend
          npm run test:phase4
          npm run test:phase4.6

      - name: Run Phase 5 & 6 Automation Reliability & Sequences Tests
        run: |
          cd backend
          npm run test:phase5
          npm run test:phase6

      - name: Run Phase 7 & 8 Concurrency & Intake Regression Tests
        run: |
          cd backend
          npm run test:regression

      - name: Run Phase 9 & 9.1 WhatsApp Reliability & Idempotency Tests
        run: |
          cd backend
          npm run test:phase9.1
          npm run test:phase9
          npm run test:whatsapp-remediation
          npm run test:whatsapp-phase4

      - name: Run Enterprise WhatsApp Baileys Reliability Suites (PR #39)
        run: |
          cd backend
          npm run test:redis-safety
          npm run test:whatsapp-auth-integrity
          npm run test:whatsapp-group-permission
          npm run test:whatsapp-dispatch-ack

      - name: Run Phase 10 Deals Domain Lifecycle Tests
        run: |
          cd backend
          npm run test:phase10

      - name: Run Phase 11 Document Storage Tests
        run: |
          cd backend
          npm run test:phase11

      - name: Run Phase 12 Bulk Deal Import Safety Tests
        run: |
          cd backend
          npm run test:phase12

      - name: Run Phase 14 Enterprise Automation Audit Logs Tests
        run: |
          cd backend
          npm run test:phase14

      - name: Run Phase 17 Infrastructure Hardening & Preflight Tests
        run: |
          cd backend
          npm run test:phase17

      - name: Run Phase D & E Outbox & Domain Event Consumer Tests
        run: |
          cd backend
          npm run test:outbox
          npm run test:phase-e

      - name: Run Phase 1-3 Authority Verification Conformance Tests
        run: |
          set -o pipefail
          cd backend
          npm run test:authority 2>&1 | tee test_authority.log
          node scripts/verify-authority-test-completeness.js test_authority.log

      - name: Run Phase 4 Authority Operational Completion Tests
        run: |
          cd backend
          npm run test:phase4-authority

      - name: Run Phase 4.4.4 Authority Portal Subsystem Tests
        run: |
          cd backend
          npm run test:authority-portal

      - name: Run Phase 4.4.4 PR #42 Authority Acceptance Gates & Residual Blockers
        run: |
          cd backend
          npm run test:authority-portal-acceptance

      - name: Run Phase 4.5 Authority Data Ingestion & Operational Acceptance Tests
        run: |
          cd backend
          npm run test:phase4.5-authority
          npm run test:phase4.5d-correction
          npm run test:phase4.5d-final-safety-correction
          npm run test:phase4.5d-final-boundary-remediation
          npm run test:phase4.5d-p56-security-remediation
          npm run test:phase4.5d-p57-residual-hardening
          npm run test:phase4.5d-p58-final-residual-security
          npm run test:phase4.5d-p59-canonical-org-write-boundary
          npm run test:phase4.5d-p60-final-write-path-audit-closure
          npm run test:phase4.5d-p61-final-security-closure
          npm run test:phase4.5d-p62-final-privacy-tenant-scope-closure
          npm run test:phase4.5d-p63-final-delete-metadata-capability-closure
          npm run test:phase4.5d-p64-final-write-privacy-capability-closure

      - name: Run Phase 18 Site Visit & Marketing OS Attribution Tests
        run: |
          cd backend
          npm run test:phase18-sitevisit

  integration-authority-portal:
    name: Authority Portal Production Integration (Redis + Mongo)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      NODE_ENV: test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-8.2.6
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Run Real Redis Integration Tests
        run: |
          cd backend
          npm run test:authority-portal-redis
          npm run test:authority-portal-acceptance
          npm run test:phase4.5d-authority
          npm run test:phase4.5d-correction

  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (Deterministic)
        run: |
          npm ci

      - name: Run Frontend unit tests
        run: |
          npm run test:frontend

      - name: Run Vite production build
        run: |
          npm run build
