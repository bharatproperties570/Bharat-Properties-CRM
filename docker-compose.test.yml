version: '3.8'

services:
  crm-test-redis:
    image: redis:7-alpine
    container_name: crm-test-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crm-test-network

networks:
  crm-test-network:
    driver: bridge
